<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/list-style.css}" rel="stylesheet" /> 
    <title>Lista Studentów</title>
</head>
<body>
    <div class="root">
        <h1>Lista Studentów</h1>
        
        <p>
            <a th:href="@{/projektList}">Lista Projektów</a> | 
            <a th:href="@{/zadanieList}">Lista Zadań</a>
        </p>
        
        <p>
            <a th:href="@{/studentEdit}">Dodaj studenta</a>
        </p>

        <form class="search-block" th:action="@{/studentList}" method="get">
            <input type="text" name="q" th:value="${q}" placeholder="Szukaj nazwiska lub nr indeksu" />
            <button type="submit">Szukaj</button>
            <a th:href="@{/studentList}">Reset</a>
        </form>
        
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Imie</th>
                    <th>Nazwisko</th>
                    <th>Nr Indeksu</th>
                    <th>E-mail</th>
                    <th>Stacjonarny</th>
                    <th>Edit</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${studenci}">
                    <td th:text="${student.studentId}">Id</td>
                    <td th:text="${student.imie}">Imie</td>
                    <td th:text="${student.nazwisko}">Nazwisko</td>
                    <td th:text="${student.nrIndeksu}">Nr Indeksu</td>
                    <td th:text="${student.email}">E-mail</td>
                    <td th:text="${student.stacjonarny}">Stacjonarny</td>
                    <td>
                        <a th:href="@{/studentEdit(studentId=${student.studentId})}">Edytuj</a><br>
                        <a th:href="@{/studentEdit(studentId=${student.studentId}, delete='true')}">Usuń</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="pagination" th:if="${page != null and page.totalPages > 1}">
            <a th:if="${page.hasPrevious()}"
               th:href="@{/studentList(page=${page.number - 1}, size=${page.size}, q=${q})}">Poprzednia</a>
            <span th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</span>
            <a th:if="${page.hasNext()}"
               th:href="@{/studentList(page=${page.number + 1}, size=${page.size}, q=${q})}">Nastepna</a>
        </div>
    </div>
</body>
</html>
